name: Windows Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        env:
          DETOURIST_ARCH: ${{ matrix.arch }}
        run: |
          $arch = $env:DETOURIST_ARCH
          $preset = "$arch-release"
          $targets = @('DetouristCaptureTests', 'DetouristHotPathTests')
          $tests = @('capture_storage', 'capture_hot_paths', 'catalog_architecture_rows')
          if ($arch -eq 'x64') {
            $targets += 'DetouristAutomationTarget'
            $tests += 'com_base_interface_tails', 'desktop_setup'
          } else {
            $tests += 'x86_catalog_metadata'
          }
          $testPattern = '^(' + ($tests -join '|') + ')$'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --preset "windows-$arch"
          cmake --build --preset $preset --target @targets
          ctest --preset $preset --no-tests=error -R $testPattern
